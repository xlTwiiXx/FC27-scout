name: update-prices

on:
  schedule:
    - cron: "0 */6 * * *"   # alle 6 Stunden (UTC). Seltener = guenstiger.
  workflow_dispatch:         # Knopf zum manuellen Starten

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preise holen
        run: node update.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: Speichern
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Preise aktualisiert" && git push)
