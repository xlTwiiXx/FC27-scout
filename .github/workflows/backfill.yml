name: backfill-history

on:
  schedule:
    - cron: "30 * * * *"     # jede Stunde zur halben Stunde, arbeitet einen Teil der Karten ab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser installieren
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Historie nachladen
        run: node backfill.mjs
      - name: Speichern
        if: always()
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add prices*.json
          git diff --cached --quiet && { echo "Nichts zu speichern"; exit 0; }
          mkdir -p /tmp/keep && cp prices*.json /tmp/keep/
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/keep/* .
            git add prices*.json
            git diff --cached --quiet && { echo "Schon aktuell"; exit 0; }
            git commit -q -m "Historie nachgeladen"
            git push -q && { echo "Gespeichert"; exit 0; }
            sleep 5
          done
          exit 1
