name: update-prices

on:
  schedule:
    - cron: "0 * * * *"      # jede Stunde (UTC)
  workflow_dispatch:         # manueller Start (laedt dann ALLE Ratings)

permissions:
  contents: write

concurrency:
  group: scout-data          # gemeinsam mit backfill: nie gleichzeitig
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser installieren
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Preise holen
        run: node update.mjs
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Ereignisse holen (SBCs, EA-Meldungen)
        if: always()
        run: node events.mjs
        continue-on-error: true
      - name: Speichern
        if: always()
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add prices*.json events.json
          git diff --cached --quiet || (git commit -m "Daten aktualisiert" && git pull --rebase -q && git push)
