name: update-prices

on:
  schedule:
    - cron: "0 * * * *"      # jede Stunde (UTC)
  workflow_dispatch:         # Knopf zum manuellen Starten (laedt dann ALLE Ratings)

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Browser installieren
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Preise holen
        run: node update.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - name: Speichern
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add prices*.json
          git diff --cached --quiet || (git commit -m "Preise aktualisiert" && git pull --rebase -q && git push)
