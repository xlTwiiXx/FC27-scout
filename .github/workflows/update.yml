name: update-prices

on:
  schedule:
    - cron: "*/15 * * * *"   # Sicherheitsnetz: startet den Dauerlauf, falls er gerade nicht laeuft
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scout-data          # es laeuft immer nur ein Lauf; ein weiterer wartet
  cancel-in-progress: false

env:
  DATA_DIR: data
  GH_REPO: ${{ github.repository }}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Daten holen (Branch data)
        run: |
          mkdir -p "$DATA_DIR"
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            for f in prices.json prices-low.json leaks.json teams.json catalog.json players-meta.json; do
              git show FETCH_HEAD:$f > "$DATA_DIR/$f" 2>/dev/null || rm -f "$DATA_DIR/$f"
            done
            echo "Daten aus dem Branch data geladen"
          else
            for f in prices.json prices-low.json leaks.json teams.json catalog.json players-meta.json; do
              if [ -f "$f" ]; then cp "$f" "$DATA_DIR/$f"; fi
            done
            echo "Branch data fehlt noch, Start mit den Dateien aus main"
          fi
          ls -la "$DATA_DIR"

      - name: Browser installieren
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Dauerlauf (alle 15 Minuten, ca. 5,5 Stunden)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash loop.sh
